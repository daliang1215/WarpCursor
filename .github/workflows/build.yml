name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建 WarpCursor.app
        run: 
          chmod +x ./build_app.sh ./scripts/make_dmg.sh
          ./build_app.sh

      - name: 打包 DMG
        run: ./scripts/make_dmg.sh

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: WarpCursor-dmg
          path: dist/*.dmg
          retention-days: 30

  # 打 tag v*（如 v1.0.0）推送后，自动把 DMG 发到 GitHub Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WarpCursor-dmg
          path: dist

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
